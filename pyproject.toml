[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sandbox = "smith_core.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smith_core", "agent_mbpp", "agent_swebench"]
